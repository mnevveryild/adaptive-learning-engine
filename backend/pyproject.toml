[project]
name = "english-learning-assistant"
version = "0.1.0"
description = "Personalized AI-powered English learning assistant"
readme = "README.md"
authors = [
    { name = "Münevver Yıldırım", email = "mnevveryldrm01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
