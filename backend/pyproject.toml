[project]
name = "english-learning-assistant"
version = "0.1.0"
description = "Personalized AI-powered English learning assistant"
readme = "README.md"
authors = [
    { name = "Münevver Yıldırım", email = "mnevveryldrm01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.2",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
